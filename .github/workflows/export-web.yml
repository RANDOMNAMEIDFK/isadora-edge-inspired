name: Export Web Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          cd /tmp
          wget -q https://github.com/godotengine/godot-releases/releases/download/4.1.1-stable/Godot_v4.1.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.1.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.1.1-stable_linux.x86_64
          echo "/tmp" >> $GITHUB_PATH

      - name: Export to HTML5
        run: |
          mkdir -p ./build
          Godot_v4.1.1-stable_linux.x86_64 --headless --export-release Web ./build/index.html

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-build
          path: build/
          retention-days: 30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
