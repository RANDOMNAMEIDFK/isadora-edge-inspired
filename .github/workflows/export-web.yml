name: Export Web Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: linuxserverio/godot:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p build

      - name: Export to Web
        run: |
          godot --headless --export-release "HTML5" build/index.html || true
          ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-web-build
          path: build/
          retention-days: 30
