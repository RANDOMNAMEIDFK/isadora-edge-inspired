<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora's Edge Inspired</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background: #0f1015;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        
        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #00d4ff;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
            font-weight: bold;
        }
        
        #info {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #00d4ff;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="controls">
        <strong>⌨️ CONTROLS</strong><br>
        ← → = Move<br>
        ↑ = Jump<br>
        SHIFT = Dash<br>
        R = Reset
    </div>
    <div id="info">
        <strong>🎮 LEVEL</strong><br>
        <span id="levelText">1</span>
    </div>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Game constants
        const GRAVITY = 1200;
        const MOVE_SPEED = 200;
        const JUMP_FORCE = -400;
        const DASH_SPEED = 600;
        const DASH_DURATION = 0.15;
        const DASH_COOLDOWN = 0.5;
        const MAX_FALL_SPEED = 500;
        
        // Player object
        const player = {
            x: 100,
            y: 300,
            width: 16,
            height: 32,
            velocityX: 0,
            velocityY: 0,
            isJumping: false,
            isDashing: false,
            dashDirection: { x: 0, y: 0 },
            dashTime: 0,
            canDash: true,
            dashCooldownTime: 0,
            jumpBufferTime: 0,
            isOnWall: false,
            health: 100,
            flipH: false,
            startX: 100,
            startY: 300
        };
        
        // Game state
        let gameState = {
            level: 1,
            cameraX: 0,
            cameraY: 0
        };
        
        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'r') resetPlayer();
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        function resetPlayer() {
            player.x = player.startX;
            player.y = player.startY;
            player.velocityX = 0;
            player.velocityY = 0;
            player.isJumping = false;
            player.isDashing = false;
            player.canDash = true;
        }
        
        // Platforms - Level 1
        const platformsLevel1 = [
            // Ground
            { x: 0, y: 550, width: 1200, height: 50, color: '#33AA33' },
            
            // First section - staircase
            { x: 300, y: 470, width: 80, height: 20, color: '#4D7FFF' },
            { x: 420, y: 410, width: 80, height: 20, color: '#4D7FFF' },
            { x: 540, y: 350, width: 80, height: 20, color: '#4D7FFF' },
            { x: 660, y: 290, width: 80, height: 20, color: '#4D7FFF' },
            
            // Moving platform (simulated)
            { x: 850, y: 350, width: 100, height: 20, color: '#FFD700' },
            
            // Jump gap
            { x: 1050, y: 400, width: 80, height: 20, color: '#4D7FFF' },
            { x: 1180, y: 350, width: 80, height: 20, color: '#4D7FFF' },
            
            // Platform spike obstacle
            { x: 1350, y: 450, width: 150, height: 20, color: '#FF6B6B' },
            
            // Narrow platforms
            { x: 1600, y: 350, width: 40, height: 20, color: '#4D7FFF' },
            { x: 1720, y: 300, width: 40, height: 20, color: '#4D7FFF' },
            { x: 1840, y: 250, width: 40, height: 20, color: '#4D7FFF' },
            
            // Wide landing area
            { x: 1900, y: 400, width: 200, height: 20, color: '#33AA33' },
        ];
        
        // Platforms - Level 2
        const platformsLevel2 = [
            // Ground
            { x: 0, y: 550, width: 1200, height: 50, color: '#33AA33' },
            
            // Spiral pattern
            { x: 250, y: 450, width: 100, height: 20, color: '#4D7FFF' },
            { x: 450, y: 380, width: 100, height: 20, color: '#4D7FFF' },
            { x: 600, y: 320, width: 80, height: 20, color: '#4D7FFF' },
            { x: 750, y: 250, width: 80, height: 20, color: '#4D7FFF' },
            { x: 880, y: 180, width: 80, height: 20, color: '#4D7FFF' },
            
            // Dash section - requires rapid dashing
            { x: 1100, y: 300, width: 60, height: 20, color: '#FF00FF' },
            { x: 1200, y: 200, width: 60, height: 20, color: '#FF00FF' },
            { x: 1300, y: 300, width: 60, height: 20, color: '#FF00FF' },
            { x: 1400, y: 200, width: 60, height: 20, color: '#FF00FF' },
            
            // Final section - wide platforms
            { x: 1600, y: 350, width: 200, height: 20, color: '#33AA33' },
        ];
        
        let platforms = platformsLevel1;
        
        // Collision detection
        function isColliding(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        function checkCollisions() {
            let isOnGround = false;
            let collidingPlatform = null;
            
            for (let platform of platforms) {
                if (isColliding(player, platform)) {
                    // Check if falling onto platform
                    if (player.velocityY > 0 && player.y + player.height - player.velocityY * 0.016 <= platform.y) {
                        isOnGround = true;
                        player.y = platform.y - player.height;
                        player.velocityY = 0;
                        player.isJumping = false;
                        collidingPlatform = platform;
                    }
                }
            }
            
            return isOnGround;
        }
        
        // Check level completion
        function checkLevelComplete() {
            if (gameState.level === 1 && player.x > 1950 && player.y > 350) {
                gameState.level = 2;
                platforms = platformsLevel2;
                player.startX = 100;
                player.startY = 300;
                resetPlayer();
            } else if (gameState.level === 2 && player.x > 1650 && player.y > 320) {
                gameState.level = 3;
                platforms = platformsLevel1; // Loop back
                player.startX = 100;
                player.startY = 300;
                resetPlayer();
            }
        }
        
        function update(deltaTime) {
            // Handle input
            let moveInput = 0;
            if (keys['arrowleft'] || keys['a']) moveInput = -1;
            if (keys['arrowright'] || keys['d']) moveInput = 1;
            
            // Handle dash
            if ((keys[' '] || keys['shift']) && player.canDash && !player.isDashing) {
                player.isDashing = true;
                let dashX = moveInput || (player.flipH ? -1 : 1);
                let dashY = 0;
                if (keys['arrowup'] || keys['w']) dashY = -1;
                if (keys['arrowdown'] || keys['s']) dashY = 1;
                
                let mag = Math.sqrt(dashX * dashX + dashY * dashY);
                if (mag > 0) {
                    player.dashDirection.x = dashX / mag;
                    player.dashDirection.y = dashY / mag;
                } else {
                    player.dashDirection.x = player.flipH ? -1 : 1;
                    player.dashDirection.y = 0;
                }
            }
            
            // Handle jump
            if (keys['arrowup'] || keys['w']) {
                player.jumpBufferTime = 0.1;
            } else {
                player.jumpBufferTime -= deltaTime;
            }
            
            if (!player.isDashing) {
                // Movement
                if (moveInput !== 0) {
                    player.velocityX = moveInput * MOVE_SPEED;
                    player.flipH = moveInput < 0;
                } else {
                    player.velocityX *= 0.9; // Friction
                }
                
                // Gravity
                player.velocityY = Math.min(player.velocityY + GRAVITY * deltaTime, MAX_FALL_SPEED);
                
                // Check ground
                let isOnGround = checkCollisions();
                
                // Jump
                if (isOnGround && player.jumpBufferTime > 0) {
                    player.velocityY = JUMP_FORCE;
                    player.isJumping = true;
                    player.jumpBufferTime = 0;
                }
            } else {
                // Dashing
                player.dashTime += deltaTime;
                player.velocityX = player.dashDirection.x * DASH_SPEED;
                player.velocityY = player.dashDirection.y * DASH_SPEED;
                
                if (player.dashTime >= DASH_DURATION) {
                    player.isDashing = false;
                    player.dashTime = 0;
                    player.canDash = false;
                    player.dashCooldownTime = DASH_COOLDOWN;
                }
            }
            
            // Update dash cooldown
            if (!player.canDash) {
                player.dashCooldownTime -= deltaTime;
                if (player.dashCooldownTime <= 0) {
                    player.canDash = true;
                }
            }
            
            // Update position
            player.x += player.velocityX * deltaTime;
            player.y += player.velocityY * deltaTime;
            
            // Update camera to follow player
            gameState.cameraX = player.x - canvas.width / 4;
            gameState.cameraY = Math.max(0, player.y - canvas.height / 3);
            
            // Reset if fell off
            if (player.y > 700) {
                resetPlayer();
            }
            
            // Check level complete
            checkLevelComplete();
        }
        
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1f2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw background grid
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = -gameState.cameraX % 50; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = -gameState.cameraY % 50; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw platforms
            for (let platform of platforms) {
                const screenX = platform.x - gameState.cameraX;
                const screenY = platform.y - gameState.cameraY;
                
                if (screenX + platform.width > -50 && screenX < canvas.width + 50) {
                    ctx.fillStyle = platform.color;
                    ctx.fillRect(screenX, screenY, platform.width, platform.height);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(screenX, screenY, platform.width, platform.height);
                }
            }
            
            // Draw player
            const playerScreenX = player.x - gameState.cameraX;
            const playerScreenY = player.y - gameState.cameraY;
            
            ctx.save();
            ctx.translate(playerScreenX + player.width / 2, playerScreenY + player.height / 2);
            if (player.flipH) ctx.scale(-1, 1);
            ctx.fillStyle = player.isDashing ? '#ff6b6b' : '#00d4ff';
            ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
            // Draw eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(-4, -8, 2, 2);
            ctx.fillRect(2, -8, 2, 2);
            ctx.restore();
            
            // Draw UI
            ctx.fillStyle = '#00d4ff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`Level: ${gameState.level}`, 20, 100);
            ctx.font = '14px Arial';
            ctx.fillText(`X: ${Math.floor(player.x)} | Dash: ${player.canDash ? '✓' : '✗'}`, 20, 120);
        }
        
        let lastTime = Date.now();
        function gameLoop() {
            const currentTime = Date.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            update(Math.min(deltaTime, 0.016)); // Cap at 60fps
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Update level text
        setInterval(() => {
            document.getElementById('levelText').textContent = gameState.level;
        }, 100);
        
        gameLoop();
    </script>
</body>
</html>
